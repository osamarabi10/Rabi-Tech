name: Tenancy bleed gate

on:
  pull_request:
  push:
    # Every branch, not only main.
    #
    # This said [main] until 2026-09-12, and the cost was eight days of work that
    # never met CI: the editions-ladder branch carried the whole tenancy harness
    # rebuild, the inbound durability fix and the terms-pin fix, and the gate saw
    # none of it until merge time. A gate that only runs where the work has
    # already landed is a gate that reports on history.
    branches: ['**']

jobs:
  tenancy-bleed:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: rabitech
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d rabitech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/backend

    env:
      DATABASE_URL: postgresql://admin:secret@localhost:5432/rabitech
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-tenancy-bleed-secret
      CHANNEL_ENCRYPTION_KEY: ci-tenancy-bleed-encryption-key-32b
      OPENWA_WEBHOOK_SECRET: ci-webhook-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - run: npm run test:tenancy
