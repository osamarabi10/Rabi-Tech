name: Tenancy bleed gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tenancy-bleed:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: rabitech
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d rabitech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/backend

    env:
      DATABASE_URL: postgresql://admin:secret@localhost:5432/rabitech
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-tenancy-bleed-secret
      OPENWA_WEBHOOK_SECRET: ci-webhook-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - run: npm run test:tenancy
