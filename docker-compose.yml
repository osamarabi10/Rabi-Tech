name: rabitech

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: rabitech
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Remapped off 5432: another local stack holds it. The container-internal
      # port is unchanged, so compose service URLs still read postgres:5432.
      # Loopback only: nothing off this machine has business reaching the
      # database. Both families are bound because localhost resolves to ::1
      # first here, and host-run Prisma and the tenancy harness dial localhost.
      - "127.0.0.1:15432:5432"
      - "[::1]:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d rabitech"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Limits exist so one runaway cannot take the host down with it. Every
    # tenant gateway is a Chromium at ~900 MiB when paired (D-11), against a
    # 7.727 GiB VM, so the platform services have to be bounded or a pairing
    # spike evicts the database. Sized with headroom over observed steady
    # state, not tight: a limit that kills a healthy process is worse than
    # none, and the provisioning worker has already been OOM-killed twice.
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      # Loopback only, both families. Redis has no password: an exposed port
      # is the whole security boundary.
      - "127.0.0.1:6379:6379"
      - "[::1]:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  openwa:
    # 0.23.2, built 2026-08-23, pinned by digest. A tag change is a deployment
    # (AGENTS.md, Evidence). Pinning does not touch the data volume: this
    # container keeps the key it minted on first boot (D-5).
    image: ghcr.io/rmyndharis/openwa@sha256:e3aa888f02157544b52fcc33a1376a77cb4ab49b63712dc5d7a47cbab67d272a
    restart: always
    ports:
      # Loopback only, both families. The backend reaches the gateway over the
      # compose network (openwa:2785), never through these host ports.
      - "127.0.0.1:13000:2785"   # REST API
      - "[::1]:13000:2785"
      - "127.0.0.1:13001:2886"   # Web dashboard (QR scanning)
      - "[::1]:13001:2886"
    environment:
      - API_KEY=${OPENWA_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_ENABLED=true
      # The gateway's SSRF guard (added in newer images) blocks webhook delivery
      # to private addresses — which is exactly where our backend lives. Allow
      # only the backend's own alias rather than turning the guard off.
      - SSRF_ALLOWED_HOSTS=backend.local,host.docker.internal
    # Makes host.docker.internal a real name on every Docker host, not just
    # Docker Desktop. Without it the name is Desktop-only, which is why the
    # webhook host was once pinned to backend.local instead (D-14).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No healthcheck override here on purpose: this image declares its own
    # (curl -f http://localhost:2785/api/health/ready, every 30s) and it works.
    # Replacing it with a wget probe would break it — there is no wget in this
    # image, and a healthcheck that cannot run marks the container unhealthy
    # for ever.
    # A gateway holds a Chromium. This one is unpaired and development-only
    # (D-6, D-12) so it sits near 145 MiB, but the ceiling is set for a
    # paired one so the limit does not become the thing that breaks pairing.
    mem_limit: 1200m
    depends_on:
      - redis
    volumes:
      - openwa_data:/app/data

  backend:
    build: ./apps/backend
    restart: always
    ports:
      # Loopback only, both families — matching postgres, redis and openwa,
      # which always were. This published on every interface until
      # 2026-09-06, which on a VPS is the API directly on the internet with
      # no TLS in front of it. Nothing outside this host should reach the
      # API except through a reverse proxy that terminates TLS.
      #
      # Tenant gateways reach it as host.docker.internal:4000, which resolves
      # to the host and is unaffected by binding to loopback.
      - "127.0.0.1:4000:4000"
      - "[::1]:4000:4000"
    volumes:
      # Backups land on the host, not inside the container. A backup that lives
      # in the thing it is backing up is not a backup.
      - ./.tools/backups:/app/backups
      - ./.tools/uploads:/app/uploads
      # Off-host replica target. Commented out deliberately: the whole value of
      # this bind is that the left-hand side is a *different device* — another
      # drive, a NAS mount, a syncing folder — and a default pointing back into
      # this repository would be the one path that looks configured and protects
      # against nothing. Uncomment, set the host path, then set
      # BACKUP_REPLICA_DIR=/app/replica and BACKUP_REPLICA_OFFHOST=1 in .env.
      - D:/rabitech-replica:/app/replica
    depends_on:
      - postgres
      - redis
      - openwa
    environment:
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/rabitech
      - REDIS_URL=redis://redis:6379
      - OPENWA_URL=http://openwa:2785
      - OPENWA_API_KEY=${OPENWA_API_KEY}
      - CHANNEL_ENCRYPTION_KEY=${CHANNEL_ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      # Meta WhatsApp Cloud API. Absent means the inbound webhook fails closed:
      # every delivery is rejected unsigned rather than trusted. Listed here
      # explicitly because this service enumerates its environment one line at a
      # time - anything missing silently falls back to a default inside the
      # container, and the default for a webhook secret is no security at all.
      - META_APP_SECRET=${META_APP_SECRET:-}
      - META_WEBHOOK_VERIFY_TOKEN=${META_WEBHOOK_VERIFY_TOKEN:-}
      # Pinned Graph version. Override only to trial a newer one; the webhook
      # parser and send path are written against the code default.
      - META_GRAPH_VERSION=${META_GRAPH_VERSION:-}
      # Stale LAN IP removed. Set FRONTEND_URL in .env to the real origin —
      # https:// once TLS is terminated in front of these services.
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - NODE_ENV=production
      # TEMPORARY: the database password is still the shipped default. Rotate it,
      # then delete this line. The backend logs a loud error on every boot until
      # you do. See docs/SECURITY-ROTATION.md
      - ALLOW_INSECURE_SECRETS=${ALLOW_INSECURE_SECRETS:-0}
      # SMTP. Absent means mail is logged, not sent — the boot log says which.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-}
      # Backups: how many automated dumps to keep. Never prunes manual ones.
      - BACKUP_KEEP=${BACKUP_KEEP:-14}
      - BACKUP_CRON=${BACKUP_CRON:-}
      # Off-host replication. Absent means dumps stay on this host only and the
      # boot log says so. Set this to /app/replica and uncomment the matching
      # bind above — the host side of that bind must be a different device, or
      # this is not off-host whatever the flag claims.
      - BACKUP_REPLICA_DIR=${BACKUP_REPLICA_DIR:-}
      - BACKUP_REPLICA_OFFHOST=${BACKUP_REPLICA_OFFHOST:-0}
      # Never sent in plaintext: no key means no upload, not an unencrypted one.
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-}
      - BACKUP_DRILL_CRON=${BACKUP_DRILL_CRON:-}
      - BACKUP_REPLICA_MAX_AGE_HOURS=${BACKUP_REPLICA_MAX_AGE_HOURS:-}
      - SNIPPET_UPLOAD_DIR=${SNIPPET_UPLOAD_DIR:-/app/uploads/snippets}
      # How a gateway container reaches this backend to deliver webhooks.
      # Must be a dotted host: the gateway's URL validator rejects single-label
      # names like "backend".
      #
      # This was backend.local until 2026-09-06, on the argument that
      # host.docker.internal is Docker-Desktop-only and would break silently on
      # a Linux VPS. The argument was right and the conclusion was wrong:
      # backend.local is an alias on THIS compose network, so a per-tenant
      # gateway — which runs in its own compose project, on its own network —
      # cannot resolve it at all. Every managed tenant got a webhook URL that
      # resolved to nothing. The fix is `extra_hosts: host-gateway` on every
      # service that crosses the host boundary, which makes
      # host.docker.internal real on Linux too. See D-14.
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://host.docker.internal:4000}
      # Billing. Without PAYMENT_WEBHOOK_SECRET every provider webhook is
      # rejected as unsigned, so activation never happens.
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-manual}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET}
      # Stripe, test mode. Deliberately no `:-` defaults: a missing secret must
      # be visible as a failure, not papered over with an empty string that
      # rejects every webhook as unsigned and looks like a Stripe outage.
      # Listed one per line because anything absent from this block silently
      # takes its own default inside the container — see CLAUDE.md.
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      # Our plan code to a Stripe price id, one per sellable edition. Stripe
      # price ids are per-environment, so a test-mode id is not the live one and
      # neither belongs in the repository. An edition with no entry here refuses
      # at checkout rather than being charged against another edition's price.
      # Keyed by interval as well as edition: on Stripe's side the interval is
      # part of what a price is, so a yearly edition is a different Price id.
      # An unmapped combination refuses at checkout rather than charging the
      # wrong one. Every edition is MONTHLY today; the YEARLY lines exist so
      # switching one is a config change rather than a code change.
      - STRIPE_PRICE_STANDARD_MONTHLY=${STRIPE_PRICE_STANDARD_MONTHLY}
      - STRIPE_PRICE_GROWTH_MONTHLY=${STRIPE_PRICE_GROWTH_MONTHLY}
      - STRIPE_PRICE_BUSINESS_MONTHLY=${STRIPE_PRICE_BUSINESS_MONTHLY}
      - STRIPE_PRICE_ENTERPRISE_MONTHLY=${STRIPE_PRICE_ENTERPRISE_MONTHLY}
      - STRIPE_PRICE_STANDARD_YEARLY=${STRIPE_PRICE_STANDARD_YEARLY}
      - STRIPE_PRICE_GROWTH_YEARLY=${STRIPE_PRICE_GROWTH_YEARLY}
      - STRIPE_PRICE_BUSINESS_YEARLY=${STRIPE_PRICE_BUSINESS_YEARLY}
      - STRIPE_PRICE_ENTERPRISE_YEARLY=${STRIPE_PRICE_ENTERPRISE_YEARLY}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8080}
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL:-http://localhost:8080}
      # Broadcast pacing. OpenWA drives WhatsApp Web, so blasting risks a ban.
      - CAMPAIGN_SEND_SPACING_MS=${CAMPAIGN_SEND_SPACING_MS:-1200}
      - CAMPAIGN_RATE_HARD_MAX=${CAMPAIGN_RATE_HARD_MAX:-}
      - CAMPAIGN_RATE_MIN_DURATION_MS=${CAMPAIGN_RATE_MIN_DURATION_MS:-}
      - CAMPAIGN_WORKER_CONCURRENCY=${CAMPAIGN_WORKER_CONCURRENCY:-8}
      - INCOMING_MESSAGE_CONCURRENCY=${INCOMING_MESSAGE_CONCURRENCY:-8}
      # Gateway health probes (H1). The status poll is a free HTTP call; the
      # self-send is an INTERNAL PROBE that sends a real WhatsApp message to the
      # subscriber own number, so it runs rarely — frequent identical automated
      # messages are how a number gets banned on an unofficial gateway.
      - GATEWAY_HEALTH_STATUS_CRON=${GATEWAY_HEALTH_STATUS_CRON:-*/15 * * * *}
      - GATEWAY_HEALTH_SELFSEND_CRON=${GATEWAY_HEALTH_SELFSEND_CRON:-0 */6 * * *}
      - GATEWAY_HEALTH_SWEEP_CRON=${GATEWAY_HEALTH_SWEEP_CRON:-30 3 * * *}
      - DISABLE_GATEWAY_HEALTH_WORKER=${DISABLE_GATEWAY_HEALTH_WORKER:-0}
      # Workflow engine (P11). WORKFLOW_WEBHOOK_ALLOW_HTTP relaxes the HTTPS-only
      # rule for local development ONLY; the private-address guard still applies.
      - DISABLE_WORKFLOW_WORKER=${DISABLE_WORKFLOW_WORKER:-0}
      - WORKFLOW_CONCURRENCY=${WORKFLOW_CONCURRENCY:-4}
      - WORKFLOW_WEBHOOK_ALLOW_HTTP=${WORKFLOW_WEBHOOK_ALLOW_HTTP:-0}
      # Edition catalogue. The backend now refuses to open its port until the
      # catalogue loads, and falls to a deny-everything floor if it goes
      # STALE_AFTER unrefreshed — so these two decide how long a database
      # outage takes to become a customer-visible restriction.
      # EDITION_REFRESH_MS was already read by the code and was never listed
      # here, which is exactly the silent-default case this file guards against.
      # Raised only for the C3 entitlement proof, which creates seven
      # organizations through the real signup path in one run. The shipped
      # default is 3/hour and the tenancy harness asserts it.
      - SIGNUP_RATE_PER_HOUR=${SIGNUP_RATE_PER_HOUR:-}
      - EDITION_REFRESH_MS=${EDITION_REFRESH_MS:-30000}
      - EDITION_STALE_AFTER_MS=${EDITION_STALE_AFTER_MS:-600000}
    healthcheck:
      # 127.0.0.1, not localhost: localhost resolves to ::1 inside this
      # container and the server listens on IPv4, so the probe would be
      # refused and the container permanently unhealthy.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 45s
    mem_limit: 1g
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          # Retained: the shared development gateway on this network still
          # reaches the backend by this name. Per-tenant gateways cannot (D-14).
          - backend.local

  # The gateway provisioning worker.
  #
  # This is the only process that records a pairing: monitorConnection ->
  # markActive. Run it in a shell and the failure mode is silent and total —
  # a customer scans the QR, their phone says "device linked", the worker is
  # not running, and the product says Disconnected forever. That is not a
  # hypothetical: it is the bug this session opened with, and the cause was a
  # hand-started process that had been OOM-killed.
  #
  # restart: always is therefore the entire point of this service.
  gateway-worker:
    build: ./apps/backend
    restart: always
    command: node dist/workers/gateway-provisioning.worker.js
    depends_on:
      - postgres
      - redis
    volumes:
      # The daemon socket. This grants root-equivalent control of the host to
      # this container, and it is mounted HERE ONLY — never on backend — so the
      # blast radius is the one process that genuinely needs it. Accepted
      # deliberately over an unsupervised worker; mitigations named in D-13.
      - /var/run/docker.sock:/var/run/docker.sock
      # The per-tenant compose file, read by the docker CLI in this container.
      # Read-only: the worker renders no templates, it only invokes this file.
      - ./deploy:/app/deploy:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Enumerated one per line for the same reason the backend service is:
      # anything missing here silently takes a default inside the container.
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/rabitech
      - REDIS_URL=redis://redis:6379
      - CHANNEL_ENCRYPTION_KEY=${CHANNEL_ENCRYPTION_KEY}
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-}
      # Where the tenant compose file lives INSIDE this container, matching the
      # read-only bind above. Without it the runtime resolves a path relative to
      # process.cwd() that does not exist here.
      - GATEWAY_COMPOSE_FILE=/app/deploy/openwa-organization.compose.yml
      # The three host-crossing names, all set explicitly so none of them falls
      # back to a code default (D-14).
      #
      # GATEWAY_HOST_ACCESS is how THIS container dials a tenant gateway on its
      # published host port. The code default is 127.0.0.1, which from inside a
      # container is the container itself — every readiness probe would dial
      # itself and time out.
      - GATEWAY_HOST_ACCESS=${GATEWAY_HOST_ACCESS:-host.docker.internal}
      - GATEWAY_BACKEND_HOST=${GATEWAY_BACKEND_HOST:-host.docker.internal}
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://host.docker.internal:4000}
      # Host port range allocated to tenant gateways.
      - GATEWAY_PORT_START=${GATEWAY_PORT_START:-}
      - GATEWAY_PORT_END=${GATEWAY_PORT_END:-}
      # Pacing and bounds. GATEWAY_PAIRING_WINDOW_MS is how long a gateway may
      # sit unscanned before it is retired to FAILED with a reason.
      - GATEWAY_READY_TIMEOUT_MS=${GATEWAY_READY_TIMEOUT_MS:-}
      - GATEWAY_WORKER_CONCURRENCY=${GATEWAY_WORKER_CONCURRENCY:-4}
      - GATEWAY_RECONCILE_INTERVAL_MS=${GATEWAY_RECONCILE_INTERVAL_MS:-30000}
      - GATEWAY_MONITOR_INTERVAL_MS=${GATEWAY_MONITOR_INTERVAL_MS:-15000}
      - GATEWAY_PAIRING_WINDOW_MS=${GATEWAY_PAIRING_WINDOW_MS:-}
    healthcheck:
      # No port to probe: this is a queue consumer. Liveness is the process
      # being alive, which is what a supervisor can act on — a wedged worker
      # still records no pairings, so restart: always plus this is the whole
      # safety net (D-13).
      test: ["CMD-SHELL", "pgrep -f gateway-provisioning.worker >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Observed at ~33 MiB running from dist. The generous ceiling is because
    # the ts-node form of this process was OOM-killed twice at ~390 MiB, and
    # a limit that reproduces that failure would defeat the point of the
    # service.
    mem_limit: 512m

  frontend:
    build:
      context: ./apps/frontend
      args:
        # Empty on a laptop, where the client falls back to localhost.
        # Set to the public https origin before building for a domain.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-owner@rabitech.co.il}
        NEXT_PUBLIC_VIDEO_GUIDES_URL: ${NEXT_PUBLIC_VIDEO_GUIDES_URL:-}
        NEXT_PUBLIC_DEVELOPER_DOCS_URL: ${NEXT_PUBLIC_DEVELOPER_DOCS_URL:-}
        NEXT_PUBLIC_REFERRAL_URL: ${NEXT_PUBLIC_REFERRAL_URL:-}
        NEXT_PUBLIC_STATUS_URL: ${NEXT_PUBLIC_STATUS_URL:-}
        NEXT_PUBLIC_PRIVACY_URL: ${NEXT_PUBLIC_PRIVACY_URL:-}
    restart: always
    ports:
      # 8081 is deliberately skipped: Playwright starts its own Next server
      # there with reuseExistingServer false.
      #
      # Loopback only, both families, for the same reason as the backend: on
      # a VPS this was the application on every interface with no TLS. The
      # reverse proxy that terminates TLS is what should reach it.
      - "127.0.0.1:18080:8080"
      - "[::1]:18080:8080"
    healthcheck:
      # 127.0.0.1 for the same reason as the backend.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    mem_limit: 768m
    depends_on:
      - backend
    environment:
      - NEXT_SERVER_API_URL=http://backend:4000
      # Present so `next start` agrees with what was compiled in, but the
      # build args below are what actually reach the browser.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:-}
      - NEXT_PUBLIC_SUPPORT_EMAIL=${NEXT_PUBLIC_SUPPORT_EMAIL:-owner@rabitech.co.il}
      - NEXT_PUBLIC_VIDEO_GUIDES_URL=${NEXT_PUBLIC_VIDEO_GUIDES_URL:-}
      - NEXT_PUBLIC_DEVELOPER_DOCS_URL=${NEXT_PUBLIC_DEVELOPER_DOCS_URL:-}
      - NEXT_PUBLIC_REFERRAL_URL=${NEXT_PUBLIC_REFERRAL_URL:-}
      - NEXT_PUBLIC_STATUS_URL=${NEXT_PUBLIC_STATUS_URL:-}
      - NEXT_PUBLIC_PRIVACY_URL=${NEXT_PUBLIC_PRIVACY_URL:-}

volumes:
  pgdata:
    name: rabitech_pgdata
  openwa_data:
    name: rabitech_openwa_data
